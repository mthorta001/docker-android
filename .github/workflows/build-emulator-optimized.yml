name: Android emulator (Optimized)

on: 
  workflow_dispatch:
    inputs: 
      tags: 
        description: 'Image tag version'
        required: true
        default: ''
      build_type:
        description: 'Build type'
        required: false
        default: 'standard'
        type: choice
        options:
          - standard
          - no-cache
          - squash
      enable_compression:
        description: 'Enable image compression'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        android: ["15.0", "16.0", "16.0_16k", "17.0_16k"]
    env:
      ANDROID_VERSION: ${{ matrix.android }}
      TRAVIS_TAG: ${{ github.event.inputs.tags }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      BUILD_TYPE: ${{ github.event.inputs.build_type }}
      ENABLE_COMPRESSION: ${{ github.event.inputs.enable_compression }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11.2
        uses: actions/setup-python@v4
        with:
          python-version: 3.11.2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Free up disk space
        run: |
          # Remove unnecessary packages to free up space
          sudo apt-get remove -y '^dotnet-.*'
          sudo apt-get remove -y '^llvm-.*'
          sudo apt-get remove -y 'php.*'
          sudo apt-get autoremove -y
          sudo apt-get clean
          
          # Remove large directories
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/graalvm/
          sudo rm -rf /usr/local/.ghcup/
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/android
          
          # Show available space
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify Docker Hub push permission
        run: |
          set -euo pipefail

          DOCKER_ORG="${DOCKER_USERNAME:-budtmo}"
          IMAGE_NAME="${DOCKER_ORG}/docker-android-x86-${ANDROID_VERSION}"
          python3 - "$IMAGE_NAME" <<'PY'
          import base64
          import binascii
          import json
          import os
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          expected_repository = sys.argv[1]
          username = os.environ["DOCKER_USERNAME"]
          password = os.environ["DOCKER_PASSWORD"]
          query = urlencode(
              {
                  "service": "registry.docker.io",
                  "scope": f"repository:{expected_repository}:pull,push",
              }
          )
          credentials = base64.b64encode(f"{username}:{password}".encode("utf-8")).decode("ascii")
          request = Request(
              f"https://auth.docker.io/token?{query}",
              headers={"Authorization": f"Basic {credentials}"},
          )

          try:
              with urlopen(request, timeout=20) as response:
                  token_response = json.load(response)
          except HTTPError as error:
              raise SystemExit(f"Docker Hub token request failed with HTTP {error.code}.") from error
          except URLError as error:
              raise SystemExit("Docker Hub token request could not be completed.") from error

          token = token_response.get("token") or token_response.get("access_token")
          if not token:
              raise SystemExit("Docker Hub did not return a bearer token for the requested repository scope.")

          try:
              payload = token.split(".")[1]
              payload += "=" * (-len(payload) % 4)
              claims = json.loads(base64.urlsafe_b64decode(payload).decode("utf-8"))
          except (IndexError, UnicodeDecodeError, ValueError, binascii.Error) as error:
              raise SystemExit(
                  "Docker Hub returned an opaque bearer token; unable to inspect its granted actions safely."
              ) from error

          actions = set()
          for access in claims.get("access", []):
              if access.get("type") == "repository" and access.get("name") == expected_repository:
                  actions.update(access.get("actions", []))

          if "push" not in actions:
              granted = ", ".join(sorted(actions)) or "none"
              raise SystemExit(
                  f"Docker Hub authenticated the credential but did not grant push for the target repository. "
                  f"Granted actions: {granted}."
              )

          print("Docker Hub granted push permission for the target repository.")
          PY

      - name: Build optimized Docker image
        env:
          PUSH_IMAGES: "false"
        run: |
          # Make build scripts executable
          chmod +x build-optimized.sh
          chmod +x travis-optimized.sh
          chmod +x release.sh
          
          # Set build options based on inputs
          if [ "$BUILD_TYPE" = "no-cache" ]; then
            export NO_CACHE=true
          fi
          if [ "$BUILD_TYPE" = "squash" ]; then
            export SQUASH=true
          fi
          if [ "$ENABLE_COMPRESSION" = "true" ]; then
            export COMPRESS=true
          fi
          
          # Run optimized build via specialized script
          bash travis-optimized.sh
        shell: bash

      - name: Test Docker image
        run: |
          set -euo pipefail

          echo "=== Available Docker images ==="
          docker images | grep docker-android || echo "No docker-android images found"
          docker images

          DOCKER_ORG="${DOCKER_USERNAME:-budtmo}"
          IMAGE_TAG="${DOCKER_ORG}/docker-android-x86-${ANDROID_VERSION}:${TRAVIS_TAG}"
          echo "Testing image: $IMAGE_TAG"

          dump_diagnostics() {
            echo "=== Container diagnostics ==="
            docker ps -a --filter name=test-container || true
            docker inspect test-container || true
            docker inspect --format '{{json .State.Health}}' test-container || true
            docker logs --timestamps test-container || true
            docker exec test-container sh -c '
              echo "=== Processes ==="
              ps aux || true
              echo "=== Listening ports ==="
              netstat -lntp || true
              echo "=== Supervisor and Appium logs ==="
              for log in /var/log/supervisor/*.log /var/log/supervisor/appium_logs/*; do
                [ -f "$log" ] || continue
                echo "--- $log ---"
                tail -n 200 "$log"
              done
            ' || true
          }

          cleanup() {
            docker rm -f test-container >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          if ! docker image inspect "$IMAGE_TAG" >/dev/null 2>&1; then
            echo "❌ Image $IMAGE_TAG not found!"
            echo "Available images:"
            docker images | grep docker-android || echo "No docker-android images found"
            exit 1
          fi

          echo "✅ Image $IMAGE_TAG found"
          echo "Starting container..."
          docker run -d --name test-container \
            --privileged \
            --shm-size=2g \
            -e DEVICE="pixel" \
            -e AVD_NAME="Pixel-Test" \
            -e RAM="8192" \
            -e DATAPARTITION="8192" \
            -e APPIUM="true" \
            -e APPIUM_PORT="4723" \
            -e ADB_PORT="5555" \
            -e WEB_VNC="false" \
            -e DEFAULT_CAPABILITIES='{"appium:skipDeviceInitialization": true, "appium:disableAndroidWatchers": true}' \
            -p 4723:4723 \
            -p 5555:5555 \
            "$IMAGE_TAG" || {
              echo "❌ Failed to start container"
              dump_diagnostics
              exit 1
            }

          echo "Waiting for the emulator, ADB, and Appium to become ready..."
          for i in {1..20}; do
            if ! docker ps --format '{{.Names}}' | grep -qx test-container; then
              echo "❌ Container stopped unexpectedly"
              dump_diagnostics
              exit 1
            fi

            health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' test-container 2>/dev/null || echo missing)
            adb_ready=false
            boot_completed=false
            appium_ready=false

            if docker exec test-container adb devices 2>/dev/null | awk '$1 ~ /^emulator-/ && $2 == "device" { found=1 } END { exit !found }'; then
              adb_ready=true
              if docker exec test-container adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -qx '1'; then
                boot_completed=true
              fi
            fi

            if docker exec test-container wget -q -T 5 -O - http://127.0.0.1:4723/wd/hub/status 2>/dev/null | jq -e '.value.ready == true' >/dev/null; then
              appium_ready=true
            fi

            echo "Check $i/20: health=$health adb=$adb_ready boot_completed=$boot_completed appium=$appium_ready"
            if [[ "$health" == "healthy" && "$adb_ready" == true && "$boot_completed" == true && "$appium_ready" == true ]]; then
              echo "✅ Emulator, ADB, and Appium are ready"
              exit 0
            fi

            sleep 15
          done

          echo "❌ Timed out waiting for the container to become ready"
          dump_diagnostics
          exit 1

      - name: Publish verified Docker image
        run: |
          set -euo pipefail

          DOCKER_ORG="${DOCKER_USERNAME:-budtmo}"
          IMAGE_NAME="${DOCKER_ORG}/docker-android-x86-${ANDROID_VERSION}"
          echo "Publishing $IMAGE_NAME:$TRAVIS_TAG and $IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$TRAVIS_TAG"
          docker push "$IMAGE_NAME:latest"

      - name: Image size report
        run: |
          echo "## Docker Image Sizes" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|" >> $GITHUB_STEP_SUMMARY
          
          # Use the same Docker org logic as in the test step
          DOCKER_ORG="${DOCKER_USERNAME:-budtmo}"
          
          # Show all built docker-android images
          echo "=== All Docker Android Images ==="
          docker images | grep docker-android || echo "No docker-android images found"
          
          # Add to GitHub summary - look for our specific pattern
          if docker images --format "{{.Repository}}:{{.Tag}} {{.Size}}" | grep "$DOCKER_ORG/docker-android-x86-" | head -5; then
            docker images --format "{{.Repository}}:{{.Tag}} {{.Size}}" | grep "$DOCKER_ORG/docker-android-x86-" | head -5 | while read image_info; do
              echo "| $image_info |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "| No $DOCKER_ORG/docker-android-x86-* images found | - |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Show in logs as well
          echo "Built images for $DOCKER_ORG:"
          docker images | grep "$DOCKER_ORG/docker-android" || echo "No images found for $DOCKER_ORG" 
